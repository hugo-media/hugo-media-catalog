<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMG — перевірка мобільного макета</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#eae6f0;font:14px Arial,sans-serif;color:#282131}header{display:flex;gap:24px;align-items:center;margin-bottom:16px}h1{font-size:18px;margin:0}label{display:flex;gap:8px;align-items:center}select{font:inherit;padding:7px}main{display:flex;gap:18px;align-items:start;--phone-width:390px}article{flex:0 0 var(--phone-width);min-width:0}article>header{display:flex;justify-content:space-between;margin-bottom:8px}iframe{display:block;width:100%;height:844px;background:#fff;border:0;box-shadow:0 0 0 1px #bbb2c8;border-radius:12px}b{font-size:13px}</style></head><body><header><h1>HMG · мобільна перевірка</h1><label>Ширина<select id="width"><option>360</option><option selected>390</option><option>430</option></select></label><label>Мова<select id="lang"><option value="uk">UA</option><option value="pl">PL</option></select></label></header><main id="phones"><article><header><b>Старт</b><select aria-label="Сторінка 1" data-frame="0"><option value="start" selected>Старт</option><option value="catalog" >Каталог</option><option value="product" >Товар</option><option value="home">Головна</option></select></header><iframe title="Старт" id="frame-0" src="/uk/start"></iframe></article><article><header><b>Каталог</b><select aria-label="Сторінка 2" data-frame="1"><option value="start" >Старт</option><option value="catalog" selected>Каталог</option><option value="product" >Товар</option><option value="home">Головна</option></select></header><iframe title="Каталог" id="frame-1" src="/uk/catalog"></iframe></article><article><header><b>Товар</b><select aria-label="Сторінка 3" data-frame="2"><option value="start" >Старт</option><option value="catalog" >Каталог</option><option value="product" selected>Товар</option><option value="home">Головна</option></select></header><iframe title="Товар" id="frame-2" src="/uk/product/43-macbook-air-rose-gold-2018-13-3-intel-core-i5-8-ram-128-gb-ssd"></iframe></article></main><script>const product="/uk/product/43-macbook-air-rose-gold-2018-13-3-intel-core-i5-8-ram-128-gb-ssd";const route=(view,lang)=>view==='product'?product.replace('/uk/','/'+lang+'/'):view==='home'?'/'+lang:'/'+lang+'/'+view;document.getElementById('width').onchange=e=>document.getElementById('phones').style.setProperty('--phone-width',e.target.value+'px');for(const select of document.querySelectorAll('[data-frame]'))select.onchange=()=>{document.getElementById('frame-'+select.dataset.frame).src=route(select.value,document.getElementById('lang').value)};document.getElementById('lang').onchange=()=>{for(const select of document.querySelectorAll('[data-frame]'))select.onchange()};</script></body></html>
