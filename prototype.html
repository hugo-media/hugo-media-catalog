function photo(p){return `<div class="hp-photo">${p.images.length?`<img src="${esc(p.images[0])}" alt="${esc(p.name)}">`:`${icon(icons[p.cat])}<span class="hp-small">${t('photo')}</span>`}<span class="hp-tag">${t('demoTag')}</span></div>`}
function option(v,label,chosen){return `<option value="${esc(v)}" ${String(v)===String(chosen)?'selected':''}>${esc(label)}</option>`}

function visible(){return eligible().filter(p=>[p.name,p.brand,p.cpu,p.gpu,p.ram,p.ssd].join(' ').toLowerCase().includes(search.toLowerCase())).filter(p=>(!filters.min||p.price>=Number(filters.min))&&(!filters.max||p.price<=Number(filters.max))&&['brand','cpu','ram','ssd','gpu'].every(k=>!filters[k]||p[k]===filters[k])).sort((a,b)=>sort==='cheap'?a.price-b.price:sort==='expensive'?b.price-a.price:b.id-a.id)}
function cards(){const list=visible();q('#hp-results').textContent=`${list.length} ${t('results')}`;q('#hp-grid').innerHTML=list.length?list.map(p=>`<article class="hp-product"><button class="hp-product-open" type="button" data-detail="${p.id}" aria-label="${t('detail')}: ${esc(p.name)}">${photo(p)}<div class="hp-product-body"><div class="hp-product-name">${esc(p.name)}</div><div class="hp-specs">${esc(p.cpu)}${p.ram?` · ${esc(p.ram)} GB RAM`:''}<br>${p.ssd?`${esc(p.ssd)} GB SSD`:'—'}${p.gpu?` · ${esc(p.gpu)}`:''}</div></div></button><div class="hp-product-foot"><span class="hp-money">${money(p.price)} <small>zł</small></span><button type="button" class="hp-add" data-add="${p.id}" aria-label="${cart.includes(p.id)?t('added'):t('add')}: ${esc(p.name)}" aria-pressed="${cart.includes(p.id)}">${icon(cart.includes(p.id)?'check':'plus')}</button></div></article>`).join(''):`<div class="hp-empty">${t('empty')}</div>`;refreshIcons()}

const content=q('#hp-content');
if(view==='catalog'){const vals=k=>[...new Set(eligible().map(p=>p[k]).filter(Boolean))].sort();content.innerHTML=`<div class="hp-intro"><div><div class="hp-kicker">Hugo selection</div><h1>${t('title')}</h1><span class="hp-muted">${t('subtitle')}</span></div><a class="hp-button hp-small" href="https://t.me/HUGO_Media" target="_blank" rel="noopener noreferrer">${icon('message-circle')}${t('ask')}</a></div><button type="button" class="hp-button hp-mobile-filter" id="hp-filter-toggle" aria-expanded="false">${icon('sliders-horizontal')}${t('filters')}</button><div class="hp-shop"><aside class="hp-filters"><h3>${t('filters')}</h3><label class="hp-field">${t('price')}<div class="hp-prices"><input type="number" min="0" data-filter="min" aria-label="${t('min')}" placeholder="${t('min')}" value="${esc(filters.min||'')}"><input type="number" min="0" data-filter="max" aria-label="${t('max')}" placeholder="${t('max')}" value="${esc(filters.max||'')}"></div></label>${selectFilter('brand',t('brand'),vals('brand'))}${cat<=0?selectFilter('cpu',t('cpu'),vals('cpu'))+selectFilter('ram',t('ram')+' (GB)',vals('ram'))+selectFilter('ssd',t('ssd')+' (GB)',vals('ssd'))+selectFilter('gpu',t('gpu'),vals('gpu')):''}<button type="button" class="hp-back" id="hp-reset">${t('reset')}</button></aside><section><div class="hp-toprow"><span id="hp-results" class="hp-muted hp-small" aria-live="polite"></span><select class="hp-sort" id="hp-sort" aria-label="${t('newest')}">${['newest','cheap','expensive'].map(s=>option(s,t(s),sort)).join('')}</select></div><div class="hp-grid" id="hp-grid"></div></section></div>`;cards()}
if(view==='detail'){const p=products.find(p=>p.id===selected);if(!p){view='catalog';render();return}const specs=[[t('cpu'),p.cpu],[t('ram'),p.ram&&p.ram+' GB'],[t('ssd'),p.ssd&&p.ssd+' GB'],[t('gpu'),p.gpu],[t('screen'),p.screen&&p.screen+'″'],[t('condition'),p.condition||t('stateValue')],[t('warranty'),p.warranty||t('unknown')]].filter(x=>x[1]);content.innerHTML=`<button type="button" class="hp-back" data-view="catalog">${icon('arrow-left')}${t('back')}</button><div class="hp-detail"><div>${photo(p)}${p.images.length>1?`<div class="hp-toprow" style="margin-top:10px">${p.images.map((src,i)=>`<button type="button" class="hp-button" data-image="${i}">${i+1}</button>`).join('')}</div>`:''}</div><div><div class="hp-kicker">${esc(p.brand)} · HMG-${p.id.toString().padStart(3,'0')}</div><h1>${esc(p.name)}</h1><span class="hp-demo-status">${t('demoTag')}</span><div class="hp-detail-price">${money(p.price)} zł</div><button type="button" class="hp-button hp-primary" data-add="${p.id}" ${p.status!==0?'disabled':''}>${icon(cart.includes(p.id)?'check':'shopping-bag')}${cart.includes(p.id)?t('added'):t('add')}</button><div class="hp-detailspec">${specs.map(([k,v])=>`<div><span>${esc(k)}</span>${esc(v)}</div>`).join('')}</div>${p[lang==='uk'?'descUk':'descPl']?`<h3>${t('description')}</h3><p style="white-space:pre-wrap">${esc(p[lang==='uk'?'descUk':'descPl'])}</p>`:''}</div></div><div class="hp-note">${t('detailNote')}</div>`}
if(view==='cart'){const items=products.filter(p=>cart.includes(p.id));const total=items.reduce((s,p)=>s+p.price,0);const message=[t('demoRequest'),t('requestText'),...items.map(p=>`• ${p.name} / HMG-${String(p.id).padStart(3,'0')} — ${p.price} zł`),`${t('total')}: ${total} zł`].join('\n');content.innerHTML=`<button type="button" class="hp-back" data-view="catalog">${icon('arrow-left')}${t('back')}</button><div class="hp-intro"><div><h1>${t('cartTitle')}</h1><span class="hp-muted">${t('cartSub')}</span></div></div>${items.length?`<div class="hp-cart-layout"><div>${items.map(p=>`<div class="hp-cart-item">${photo(p)}<div class="hp-cart-text"><b>${esc(p.name)}</b><div class="hp-muted hp-small">HMG-${String(p.id).padStart(3,'0')}</div><strong>${money(p.price)} zł</strong></div><button type="button" data-remove="${p.id}" aria-label="${t('remove')}: ${esc(p.name)}">${icon('x')}</button></div>`).join('')}</div><div class="hp-summary"><div class="hp-toprow"><span>${t('total')}</span><span class="hp-money">${money(total)} zł</span></div><p class="hp-small hp-muted">${t('cartNote')}</p><button type="button" class="hp-button hp-primary" disabled>${icon('send')}${t('request')}</button><textarea readonly id="hp-message" aria-label="${t('request')}">${esc(message)}</textarea><button type="button" class="hp-button" id="hp-copy">${icon('copy')}${t('copy')}</button><div class="hp-toast" id="hp-toast" aria-live="polite"></div><div class="hp-note">${t('demoCart')}</div></div></div>`:`<div class="hp-empty"><p>${t('cartEmpty')}</p><button type="button" class="hp-button hp-primary" data-view="catalog">${t('continue')}</button></div>`}`}
if(view==='admin'){content.innerHTML=`<div class="hp-intro"><div><h1>${t('manage')}</h1><span class="hp-muted">${t('manageSub')}</span></div><button type="button" class="hp-button hp-primary" id="hp-new">${icon('plus')}${t('newProduct')}</button></div><div class="hp-admin-list">${products.map(p=>`<div class="hp-admin-row"><div><b>${esc(p.name)}</b><div class="hp-small hp-muted">HMG-${String(p.id).padStart(3,'0')} · ${t('categories')[p.cat]}</div></div><b>${money(p.price)} zł</b><select data-status="${p.id}" aria-label="${t('status')}: ${esc(p.name)}">${t('statuses').map((s,i)=>option(i,s,p.status)).join('')}</select><div class="hp-admin-actions"><button type="button" data-edit="${p.id}" aria-label="${t('edit')}: ${esc(p.name)}">${icon('pencil')}</button><button type="button" data-duplicate="${p.id}" aria-label="${t('duplicate')}: ${esc(p.name)}">${icon('copy')}</button><button type="button" data-delete="${p.id}" aria-label="${t('delete')}: ${esc(p.name)}">${icon('trash-2')}</button></div></div>`).join('')}</div><div class="hp-note">${t('adminNote')}</div>`}

function field(key,label,value='',type='text',required=false){return `<label class="hp-field">${label}<input name="${key}" value="${esc(value)}" type="${type}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}></label>`}
function renderForm(){const p=products.find(p=>p.id===editId)||{name:'',price:'',brand:'',cat:cat<0?0:cat,status:3};q('#hp-content').innerHTML=`<button type="button" class="hp-back" data-view="admin">${icon('arrow-left')}${t('admin')}</button><h2>${editId?t('edit'):t('newProduct')}</h2><form class="hp-form" id="hp-form"><div class="hp-form-grid"><div class="hp-wide">${field('name',t('name'),p.name,'text',true)}</div><label class="hp-field">${t('category')}<select name="cat" id="hp-form-cat">${t('categories').map((c,i)=>option(i,c,p.cat)).join('')}</select></label>${field('brand',t('brand'),p.brand,'text',true)}${field('price',t('price'),p.price,'number',true)}<label class="hp-field">${t('status')}<select name="status">${t('statuses').map((s,i)=>option(i,s,p.status)).join('')}</select></label><div class="hp-wide"><h3>${t('spec')}</h3><div class="hp-form-grid" id="hp-category-fields"></div></div>${field('condition',t('condition'),p.condition)}${field('warranty',t('warranty'),p.warranty)}<label class="hp-field hp-wide">${t('photos')}<input type="file" id="hp-upload" multiple accept="image/jpeg,image/png,image/webp"><span class="hp-muted hp-small">${t('photoHint')}</span><div id="hp-upload-previews" class="hp-toprow"></div></label><label class="hp-field">${t('descUk')}<textarea name="descUk">${esc(p.descUk)}</textarea></label><label class="hp-field">${t('descPl')}<textarea name="descPl">${esc(p.descPl)}</textarea></label></div><div role="alert" id="hp-form-error" class="hp-muted"></div><div class="hp-form-actions"><button type="button" class="hp-button" data-view="admin">${t('cancel')}</button><button type="submit" class="hp-button hp-primary">${t('save')}</button></div></form>`;formCategory(p.cat,p);showUploads()}
function formCategory(c,p={}){let defs=c===0?[['cpu','model'],['ram','ram'],['ssd','ssd'],['gpu','gpu'],['screen','diagonal']]:c===1||c===2?[['cpu','model'],['ram','ram'],['ssd','memory'],['screen','diagonal'],['battery','battery'],['os','os']]:c===5?[['screen','diagonal'],['resolution','resolution'],['hz','hz']]:[['type','type']];q('#hp-category-fields').innerHTML=defs.map(([key,label])=>field(key,t(label),p[key]||'')).join('')}
function showUploads(){q('#hp-upload-previews').innerHTML=formImages.map((src,i)=>`<div style="margin-top:10px"><img src="${esc(src)}" alt="${i+1}" style="width:74px;height:64px;object-fit:contain"><button type="button" data-remove-photo="${i}" aria-label="${t('remove')} ${i+1}">×</button></div>`).join('')}
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.lang){lang=b.dataset.lang;render()}else if(b.dataset.cat!==undefined){cat=Number(b.dataset.cat);filters={};view='catalog';render()}else if(b.dataset.detail){selected=Number(b.dataset.detail);view='detail';render()}else if(b.dataset.add){const id=Number(b.dataset.add);cart=cart.includes(id)?cart.filter(x=>x!==id):[...cart,id];render()}else if(b.dataset.remove){cart=cart.filter(x=>x!==Number(b.dataset.remove));render()}else if(b.id==='hp-reset'){filters={};search='';q('#hp-search').value='';render()}else if(b.id==='hp-filter-toggle'){const open=q('.hp-filters').classList.toggle('hp-show');b.setAttribute('aria-expanded',open)}else if(b.dataset.edit||b.id==='hp-new'){editId=b.dataset.edit?Number(b.dataset.edit):null;formImages=editId?[...products.find(p=>p.id===editId).images]:[];view='edit';render()}else if(b.dataset.delete){if(confirm(t('confirmDelete'))){products=products.filter(p=>p.id!==Number(b.dataset.delete));cart=cart.filter(id=>id!==Number(b.dataset.delete));render()}}else if(b.dataset.duplicate){const p=products.find(p=>p.id===Number(b.dataset.duplicate));products.push({...p,id:Math.max(0,...products.map(p=>p.id))+1,status:3,images:[...p.images]});render()}else if(b.dataset.removePhoto!==undefined){formImages.splice(Number(b.dataset.removePhoto),1);showUploads()}else if(b.dataset.image!==undefined){q('.hp-detail .hp-photo img').src=products.find(p=>p.id===selected).images[Number(b.dataset.image)]}else if(b.id==='hp-copy'){try{await navigator.clipboard.writeText(q('#hp-message').value);q('#hp-toast').textContent=t('copied')}catch{q('#hp-message').select();q('#hp-toast').textContent=t('copyFallback')}}});
root.addEventListener('input',e=>{if(e.target.id==='hp-search'){search=e.target.value;if(view!=='catalog'){view='catalog';render()}else cards()}else if(e.target.matches('input[data-filter]')){filters[e.target.dataset.filter]=e.target.value;cards()}});
root.addEventListener('change',async e=>{const el=e.target;if(el.matches('select[data-filter]')){filters[el.dataset.filter]=el.value;cards()}else if(el.id==='hp-sort'){sort=el.value;cards()}else if(el.dataset.status){const p=products.find(p=>p.id===Number(el.dataset.status));p.status=Number(el.value);if(p.status!==0)cart=cart.filter(id=>id!==p.id);render()}else if(el.id==='hp-form-cat'){formCategory(Number(el.value))}else if(el.id==='hp-upload'){const files=[...el.files];if(files.length+formImages.length>5||files.some(f=>f.size>5*1024*1024||!['image/jpeg','image/png','image/webp'].includes(f.type))){q('#hp-form-error').textContent=t('imageError');el.value='';return}for(const f of files){const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});formImages.push(src)}q('#hp-form-error').textContent='';showUploads();el.value=''}});
root.addEventListener('submit',e=>{if(e.target.id!=='hp-form')return;e.preventDefault();const form=e.target;const d=Object.fromEntries(new FormData(form));const previous=products.find(p=>p.id===editId);const p={...(previous||{}),...d,id:editId||Math.max(0,...products.map(p=>p.id))+1,cat:Number(d.cat),price:Number(d.price),status:Number(d.status),images:[...formImages]};if(!p.name.trim()||!p.brand.trim()||!Number.isFinite(p.price)||p.price<0)return;if(previous)products=products.map(x=>x.id===p.id?p:x);else products.push(p);if(p.status!==0)cart=cart.filter(id=>id!==p.id);view='admin';render()});
render();
})();
</script>
