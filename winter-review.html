<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hugo Media · Зимова вітрина</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0eb;color:#302635;font:15px/1.5 system-ui}main{max-width:1290px;margin:auto;padding:clamp(18px,3vw,44px)}.over{letter-spacing:.2em;font-size:11px;font-weight:750;color:#675164}h1{font:400 clamp(34px,5vw,60px)/1.05 Georgia,serif;margin:.25em 0}.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}h2{font-size:17px;margin:0}header{display:flex;align-items:center;justify-content:space-between;min-height:52px;gap:8px}a{color:#59334f;text-underline-offset:3px;padding:10px 0}iframe{width:100%;height:min(80vh,844px);border:1px solid #cfc5c9;border-radius:18px;background:white;box-shadow:0 8px 22px #30263512}.tabs{display:none}@media(max-width:900px){.views{display:block}.views section{display:none}.views section.active{display:block}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{min-height:44px;padding:0 13px;border-radius:10px;border:1px solid #c8bdc4;color:#493c46;background:#fff}.tabs [aria-pressed=true]{background:#372b3a;color:white}.views iframe{height:75svh}}</style><main><div class="over">HUGO MEDIA / WINTER EDITION</div><h1>Зимова вітрина</h1><p>Три робочі екрани. Гортай, відкривай товари або перейди на повну сторінку.</p><nav class="tabs" aria-label="Екран"></nav><div class="views"></div></main><script>const pages=[['Старт','/uk/start'],['Каталог','/uk/catalog'],['Товар','/uk/product/72-lenovo-thinkpad-t460-core-i5-8-gb-ram-256-gb-ssd']];pages.forEach(([label,url],i)=>{const section=document.createElement('section');section.className=i?'':'active';section.innerHTML='<header><h2>0'+(i+1)+' / '+label+'</h2><a href="'+url+'">Відкрити ↗</a></header><iframe title="'+label+'" src="'+url+'"></iframe>';document.querySelector('.views').append(section);const button=document.createElement('button');button.textContent=label;button.setAttribute('aria-pressed',String(!i));button.onclick=()=>{document.querySelectorAll('.views section').forEach((el,k)=>el.classList.toggle('active',i===k));document.querySelectorAll('.tabs button').forEach((el,k)=>el.setAttribute('aria-pressed',String(i===k)))};document.querySelector('.tabs').append(button)})</script></html>
