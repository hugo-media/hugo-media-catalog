name: Catalog checks

on:
  push:
    branches: [main, seo-content-readiness]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reviewed dependency lock (temporary)
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "console.log('HMG_LOCK_BEGIN'); console.log(require('node:fs').readFileSync('package-lock.json','utf8')); console.log('HMG_LOCK_END')"
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
